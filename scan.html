<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور | Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .scan-container {
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 24px;
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 400px;
        }
        .success-icon {
            color: var(--success-color);
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
        }
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <div class="container" style="display:flex; justify-content:center;">
        
        <!-- Loading State -->
        <div id="loading" class="scan-container">
            <div class="loader" style="margin: 0 auto 20px;"></div>
            <h2 id="loading-text">جاري تسجيل الحضور...</h2>
        </div>

        <!-- Success State -->
        <div id="success-state" class="scan-container hidden">
            <svg class="success-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h1 style="color: var(--success-color);">تم تأكيد الحضور!</h1>
            <p id="attendee-name" style="margin: 15px 0; font-size: 1.2rem;"></p>
            <button class="btn" onclick="window.close()">إغلاق الصفحة</button>
        </div>

        <!-- Error State -->
        <div id="error-state" class="scan-container hidden">
            <svg class="success-icon" style="color: var(--error-color);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <h1 style="color: var(--error-color);">خطأ في التسجيل</h1>
            <p id="error-msg" style="margin: 15px 0;"></p>
        </div>

    </div>

    <!-- We reuse the SCRIPT_URL from script.js, but since it's a separate page, we define logic here inline for simplicity to ensure it works directly. -->
    <script src="scan.js"></script>
</body>
</html>
